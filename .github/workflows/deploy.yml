name: Publish to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare static files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rimata-site"
          cp index.html style.css app.js data.js glossary.js "$RUNNER_TEMP/rimata-site/"

      - name: Publish to existing Pages project
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.161.0'
          command: pages deploy ${{ runner.temp }}/rimata-site --project-name=ellinika-rimata --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
